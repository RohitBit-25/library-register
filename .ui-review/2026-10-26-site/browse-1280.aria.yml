  - complementary:
    - heading "How it works" [level=2]
    - list:
      - listitem: 1 Pick a free seat Green seats are open. Use the shift filter if you only need mornings or evenings.
      - listitem: 2 Send a request Your name and phone number. No account needed.
      - listitem: 3 Pay and get allotted Pay by UPI or cash at the desk. The librarian confirms it and allots your seat — follow it under My requests.
