- main:
  - heading "Request link & automation" [level=1]
  - paragraph: Connect Google Forms for automated seat allotment and email notifications.
  - heading "How It Works — Zero Manual Work" [level=2]
  - text: Member scans QR Fills the form Script runs You get an email Portal active
